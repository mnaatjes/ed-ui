[tool.bumpversion]
current_version = "0.2.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "chore(release): bump version {current_version} -> {new_version}"
commit = true
message = "chore(release): bump version {current_version} -> {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "pyproject.toml"

[[tool.bumpversion.files]]
filename = "python/ed_ui_core/pyproject.toml"

[[tool.bumpversion.files]]
filename = "python/ed_ui_tk/pyproject.toml"

[[tool.bumpversion.files]]
filename = "python/ed_ui_cli/pyproject.toml"

[[tool.bumpversion.files]]
filename = "README.md"
search = "badge/version-{current_version}-blue.svg"
replace = "badge/version-{new_version}-blue.svg"

[[tool.bumpversion.files]]
filename = "README.md"
search = "[Version: {current_version}]"
replace = "[Version: {new_version}]"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = "## [Unreleased]\n\n## [{new_version}] - {now:%Y-%m-%d}"
