[project]
name = "ed-ui-workspace"
version = "0.1.0"
description = "Monorepo workspace for Elite Dangerous presentation and UI component libraries"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.uv.workspace]
members = ["python/*"]

[tool.uv.sources]
ed-ui-core = { workspace = true }
ed-ui-tk = { workspace = true }
ed-ui-cli = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.3",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "bump-my-version>=0.28.0",
    "pytest-asyncio>=1.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["web/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
exclude = ["^web/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
norecursedirs = ["web", "node_modules", ".venv"]
